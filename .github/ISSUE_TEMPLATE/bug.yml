name: 🐞 Bug
description: Algo no funciona como debería
title: "[Bug] "
labels: ["tipo: bug"]
body:
  - type: dropdown
    id: severidad
    attributes:
      label: Severidad
      description: "P0 rompe un flujo central o expone datos · P1 flujo importante con workaround · P2 molesto · P3 cosmético"
      options: ["P0 crítico", "P1 alto", "P2 medio", "P3 bajo"]
    validations: { required: true }
  - type: dropdown
    id: rol
    attributes:
      label: ¿Quién lo ve?
      multiple: true
      options: [Administrador, Vecino, Superadmin, Visitante (landing), Todos]
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
      placeholder: |
        1. Entrar como admin
        2. Ir a Gastos → Nuevo gasto
        3. …
    validations: { required: true }
  - type: textarea
    id: esperado
    attributes:
      label: Qué esperaba vs. qué pasó
    validations: { required: true }
  - type: textarea
    id: evidencia
    attributes:
      label: Evidencia
      description: Captura, error de consola, respuesta del servidor
  - type: input
    id: dispositivo
    attributes:
      label: Dispositivo / navegador
      placeholder: "iPhone Safari, Chrome desktop…"
