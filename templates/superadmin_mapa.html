<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa conceptual | Niddo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/niddo-brand.css') }}">
<style>
*{box-sizing:border-box; margin:0; padding:0;}
html,body{ height:100%; background:var(--nd-crema); color:var(--text); font-family:var(--font); overflow:hidden; }
#shell{ display:flex; flex-direction:column; height:100vh; }
header{ display:flex; align-items:center; justify-content:space-between; gap:16px; padding:.9rem 1.25rem; border-bottom:1px solid var(--border); background:var(--surface); flex-wrap:wrap; row-gap:10px; }
.brand{ display:flex; align-items:center; gap:.6rem; }
.brand .sub{ font-size:.74rem; color:var(--muted); }
.brand a.volver{ color:var(--nd-terracota-hondo); font-size:.78rem; font-weight:700; text-decoration:none; margin-left:.5rem; padding:.25rem .7rem; border:1px solid var(--border); border-radius:var(--r-pill); }
.brand a.volver:hover{ border-color:var(--nd-terracota); background:var(--nd-terracota-dim); }
nav{ display:flex; gap:.25rem; background:var(--nd-crema); border:1px solid var(--border); border-radius:var(--r-pill); padding:.25rem; }
nav button{ background:transparent; border:none; color:var(--muted); font-family:var(--font); font-size:.82rem; font-weight:700; padding:.5rem 1rem; border-radius:var(--r-pill); cursor:pointer; transition:background .18s, color .18s; white-space:nowrap; }
nav button:hover{ color:var(--text); }
nav button.active{ background:var(--nd-terracota); color:var(--nd-tinta); }
#stage{ position:relative; flex:1; min-height:0; }
iframe.view-frame{ position:absolute; inset:0; width:100%; height:100%; border:0; background:var(--bg); visibility:hidden; pointer-events:none; }
iframe.view-frame.active{ visibility:visible; pointer-events:auto; }
@media (max-width:640px){ header{ padding:.75rem .9rem; } nav button{ padding:.45rem .75rem; font-size:.76rem; } .brand .sub{ display:none; } }
</style>
</head>
<body>
<div id="shell">
  <header>
    <div class="brand">
      <span class="nd-logo">nidd<span class="o">o</span></span><span class="sub">mapa conceptual</span>
      <a class="volver" href="/superadmin">← volver a Superadmin</a>
    </div>
    <nav id="tabs">
      <button data-src="{{ url_for('superadmin_mapa_categorias') }}" class="active">Por categoría</button>
      <button data-src="{{ url_for('superadmin_mapa_admin_vecino') }}">Admin × Vecino</button>
      <button data-src="{{ url_for('superadmin_mapa_arquitectura') }}">Arquitectura</button>
    </nav>
  </header>
  <div id="stage">
    <iframe id="frame-cat" class="view-frame active" src="{{ url_for('superadmin_mapa_categorias') }}" title="Funcionalidades por categoría"></iframe>
    <iframe id="frame-av" class="view-frame" title="Admin por Vecino"></iframe>
    <iframe id="frame-arch" class="view-frame" title="Arquitectura técnica"></iframe>
  </div>
</div>
<script>
const frames = {
  cat: document.getElementById('frame-cat'),
  av: document.getElementById('frame-av'),
  arch: document.getElementById('frame-arch')
};
const loadedOnce = { cat: true, av: false, arch: false };

document.getElementById('tabs').addEventListener('click', (e)=>{
  const btn = e.target.closest('button[data-src]');
  if(!btn) return;
  const buttons = [...document.querySelectorAll('#tabs button')];
  const idx = buttons.indexOf(btn);
  const key = ['cat','av','arch'][idx];

  buttons.forEach(b=>b.classList.toggle('active', b===btn));
  Object.entries(frames).forEach(([k, frame])=> frame.classList.toggle('active', k===key));

  const frame = frames[key];
  if(!loadedOnce[key]){
    frame.src = btn.dataset.src;
    loadedOnce[key] = true;
  } else if(frame.contentWindow){
    try{ frame.contentWindow.dispatchEvent(new Event('resize')); }catch(err){}
  }
});
</script>
</body>
</html>
